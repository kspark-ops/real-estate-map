<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 리포트</title>

    <!-- Leaflet 지도 엔진 & 엑셀 파서 (지도가 정상 동작한 것과 동일한 CDN으로 통일) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --brand: #004986;      /* PANTONE 2186 C, 펄어비스 CI 컬러 */
            --brand-dark: #013a68;
            --brand-tint: #e8f1f8;
            --ink: #222222;        /* Airbnb 스타일 진한 텍스트 */
            --muted: #717171;      /* Airbnb 스타일 보조 텍스트 */
            --line: #ebebeb;       /* Airbnb 스타일 옅은 구분선 */
            --card-shadow: 0 6px 20px rgba(0,0,0,0.08);
            --card-shadow-lg: 0 10px 30px rgba(0,0,0,0.10);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #fafafa; }

        #app-shell { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        /* ============================== 상단 고정 내비게이션 바 ============================== */
        #topbar {
            display: flex; align-items: center; gap: 18px;
            height: 76px; flex-shrink: 0; padding: 0 22px;
            background: #ffffff; border-bottom: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); z-index: 1000; position: relative;
        }
        .topbar-brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex-shrink: 0; cursor: pointer; padding: 6px; margin: -6px; border-radius: 10px; transition: background .15s; }
        .topbar-brand:hover { background: #f5f5f5; }
        .brand-logo { height: 26px; width: auto; flex-shrink: 0; }
        .brand-text { min-width: 0; }
        .brand-title {
            font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -0.2px;
            white-space: nowrap; line-height: 1.25;
        }
        .brand-subtitle {
            font-size: 11.5px; font-weight: 500; color: var(--muted); margin-top: 3px;
            white-space: nowrap;
        }
        .brand-subtitle #header-report-date { font-weight: 600; color: var(--muted); }

        .topbar-center { display: flex; align-items: center; justify-content: center; gap: 14px; flex: 1; min-width: 0; margin-right: 144px; }

        .topbar-search {
            display: flex; align-items: center; gap: 6px;
            background: #f7f7f7; border: 1px solid var(--line); border-radius: 999px;
            padding: 8px 8px 8px 16px; width: 260px; min-width: 150px; flex-shrink: 1;
        }
        .topbar-search .search-icon { font-size: 12px; opacity: 0.6; }
        .topbar-search input { border: none; outline: none; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink); flex: 1; }
        .topbar-search button {
            border: none; background: var(--brand); color: #fff; border-radius: 999px;
            padding: 6px 14px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .topbar-search button:hover { background: var(--brand-dark); }

        .topbar-stats { display: flex; gap: 8px; flex-shrink: 0; }
        .stat-pill {
            display: flex; align-items: baseline; gap: 6px; cursor: pointer;
            background: var(--brand-tint); border-radius: 999px; padding: 8px 16px;
            transition: background .15s, transform .15s;
        }
        .stat-pill:hover { background: #d9e8f3; transform: translateY(-1px); }
        .stat-label { font-size: 11.5px; font-weight: 600; color: var(--brand); }
        .stat-val { font-size: 15px; font-weight: 800; color: var(--brand-dark); }

        .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .map-filter-dropdown { position: absolute; bottom: 16px; left: 16px; z-index: 1000; }
        .map-filter-btn {
            background: #ffffff; border: 1px solid var(--line); padding: 10px 16px;
            border-radius: 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink);
            box-shadow: var(--card-shadow);
        }
        .map-filter-btn:hover { background: var(--brand-tint); color: var(--brand); border-color: var(--brand); }

        .compare-float-btn {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: var(--ink); color: #fff; border: none; border-radius: 999px;
            padding: 12px 22px; font-size: 13px; font-weight: 700; cursor: pointer;
            box-shadow: var(--card-shadow-lg); align-items: center; gap: 8px;
        }
        .compare-float-btn:hover { background: #000; }
        .compare-float-count {
            background: var(--brand); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 800;
        }

        .compare-table { display: grid; row-gap: 0; column-gap: 8px; font-size: 12px; }
        .ct-cell { padding: 10px 6px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
        .ct-label { font-weight: 700; color: var(--muted); font-size: 11px; }
        .ct-head { flex-direction: column; align-items: flex-start; gap: 4px; border-bottom: 2px solid var(--ink); }
        .ct-head-name { font-weight: 800; color: var(--ink); font-size: 12px; line-height: 1.35; }
        .ct-remove {
            border: none; background: #f0f0f0; color: var(--muted); border-radius: 999px;
            width: 18px; height: 18px; font-size: 10px; cursor: pointer; line-height: 1;
        }
        .ct-remove:hover { background: #fee2e2; color: #b91c1c; }
        .topbar-btn {
            background: #ffffff; border: 1px solid var(--line); padding: 9px 13px;
            border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink);
        }
        .topbar-btn:hover { background: var(--brand-tint); color: var(--brand); border-color: var(--brand); }
        .topbar-btn.primary { background: var(--brand); color: #fff; border: none; }
        .topbar-btn.primary:hover { background: var(--brand-dark); }

        .filter-panel {
            display: none; position: absolute; bottom: calc(100% + 10px); left: 0; z-index: 1000;
            background: #ffffff; border: 1px solid var(--line); border-radius: 14px;
            box-shadow: var(--card-shadow-lg); padding: 16px; width: 220px;
        }
        .filter-panel.open { display: block; }
        .filter-group { margin-bottom: 14px; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-group-title { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
        .toggle-item { display: flex; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer; margin-bottom: 7px; }
        .toggle-item:last-child { margin-bottom: 0; }
        .toggle-item input { margin-right: 8px; width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }

        /* 상세 필터: 드롭다운 & 듀얼 레인지 슬라이더 */
        .filter-select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
            font-size: 12px; font-weight: 600; color: var(--ink); background: #fff; cursor: pointer;
        }
        .range-slider { position: relative; height: 20px; margin: 12px 2px 6px; }
        .range-track { position: absolute; top: 50%; left: 0; right: 0; height: 4px; background: #e5e5e5; border-radius: 2px; transform: translateY(-50%); }
        .range-fill { position: absolute; top: 50%; height: 4px; background: var(--brand); border-radius: 2px; transform: translateY(-50%); }
        .range-input {
            position: absolute; width: 100%; top: 0; left: 0; margin: 0; height: 20px;
            background: transparent; pointer-events: none; -webkit-appearance: none; appearance: none;
        }
        .range-input::-webkit-slider-thumb {
            -webkit-appearance: none; pointer-events: auto; width: 15px; height: 15px; border-radius: 50%;
            background: #fff; border: 3px solid var(--brand); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .range-input::-moz-range-thumb {
            pointer-events: auto; width: 15px; height: 15px; border-radius: 50%;
            background: #fff; border: 3px solid var(--brand); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .range-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); font-weight: 700; }
        .filter-reset-btn {
            width: 100%; margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
            background: #ffffff; font-size: 11.5px; font-weight: 700; color: var(--muted); cursor: pointer;
        }
        .filter-reset-btn:hover { background: #f7f7f7; color: var(--ink); }

        /* ============================== 본문: 지도 + 상세정보 패널 ============================== */
        #body-row { flex: 1; display: flex; min-height: 0; position: relative; }

        #map-container { flex: 1; height: 100%; position: relative; background: #f2f2f2; }
        #map { width: 100%; height: 100%; z-index: 1; }

        #sidebar {
            width: 528px; height: 100%; background: #ffffff;
            border-left: 1px solid var(--line); display: flex; flex-direction: column;
            z-index: 500; box-shadow: -6px 0 24px rgba(0,0,0,0.05);
        }
        .sidebar-content { padding: 28px 26px; flex: 1; overflow-y: auto; position: relative; }

        /* 상세 UI (Airbnb 리스팅 스타일 참고) */
        .badge-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .type-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
        }
        .type-badge.land { background: #fef3e6; color: #b5620a; border: 1px solid #fbdcae; }
        .type-badge.bldg { background: var(--brand-tint); color: var(--brand); border: 1px solid #cfe0ee; }

        .compare-add-small {
            border: 1.5px solid var(--brand); background: #ffffff; color: var(--brand);
            border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .compare-add-small:hover { background: var(--brand-tint); }
        .compare-add-small.active { background: var(--brand); color: #fff; }
        .compare-add-small.active:hover { background: var(--brand-dark); }

        .asset-title { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 18px; letter-spacing: -0.3px; line-height: 1.35; }

        .summary-card {
            background: #f7f7f7; border-radius: 16px;
            padding: 18px 20px; margin-bottom: 26px; display: grid; grid-template-columns: 1fr 1fr;
        }
        .summary-label { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .summary-val-blue { font-size: 18px; font-weight: 800; color: var(--brand); }
        .summary-val-dark { font-size: 18px; font-weight: 800; color: var(--ink); }

        .detail-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 26px; font-size: 13.5px; }
        .detail-item { display: flex; align-items: baseline; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
        .detail-item:last-child { border-bottom: none; padding-bottom: 0; }
        .detail-label { width: 120px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
        .detail-val { flex: 1; font-weight: 600; color: var(--ink); word-break: keep-all; }

        .section-subtitle { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
        .opinion-box {
            background: #f7f7f7; border-radius: 14px; padding: 16px 18px;
            font-size: 13.5px; line-height: 1.65; color: #3a3a3a; font-weight: 500;
            border-left: 3px solid var(--brand);
        }

        /* 인근 실거래가 비교 */
        .compare-btn {
            width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: 12px;
            background: var(--brand); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer;
            transition: background .15s;
        }
        .compare-btn:hover { background: var(--brand-dark); }
        #compare-result { margin-top: 16px; }
        .compare-loading { font-size: 12.5px; color: var(--muted); padding: 10px 0; }
        .compare-error { font-size: 12.5px; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 14px; line-height: 1.6; }
        .compare-summary { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
        .compare-verdict { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; margin-bottom: 12px; }
        .verdict-high { background: #fef2f2; color: #b91c1c; }
        .verdict-mid { background: #ecfdf3; color: #15803d; }
        .verdict-low { background: var(--brand-tint); color: var(--brand); }
        .compare-chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
        .compare-chart-label { width: 78px; font-size: 11.5px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
        .compare-chart-track { flex: 1; background: #f0f0f0; border-radius: 999px; height: 18px; position: relative; overflow: hidden; }
        .compare-chart-bar { height: 100%; border-radius: 999px; }
        .compare-chart-val { font-size: 11.5px; font-weight: 700; color: var(--ink); width: 88px; text-align: right; flex-shrink: 0; }
        .compare-samples { margin-top: 12px; max-height: 200px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 10px; }
        .compare-sample-row { font-size: 11px; color: #3a3a3a; font-weight: 600; padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.5; }

        .empty-side { text-align:center; color:#a3a3a3; margin-top:140px; }
        .empty-side .icon { font-size:40px; margin-bottom:12px; }

        .sidebar-welcome {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: calc(100% - 8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: #a3a3a3;
        }
        .sidebar-welcome .icon { font-size: 40px; margin-bottom: 14px; }

        /* 지도 마커 핀 */
        .pin {
            display: inline-block; padding: 5px 11px; border-radius: 999px;
            font-size: 11.5px; font-weight: 700; color: #fff; border: 2px solid #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25); white-space: nowrap; cursor: pointer;
            transform: translate(-50%, -50%) scale(var(--marker-scale, 1));
            transform-origin: center center;
            max-width: 150px; overflow: hidden;
        }
        .pin-label { display: inline-block; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
        .pin-land { background: #e8890c; }             /* 토지 - 웜 앰버 */
        .pin-bldg { background: var(--brand); }          /* 건물 - 브랜드 블루 */
        .pin-home {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
            border-radius: 999px; font-size: 11.5px; font-weight: 800; color: #ffffff;
            background: linear-gradient(135deg, #1a1a1a, #000000);
            border: 2px solid #ffd700; box-shadow: 0 0 0 2px rgba(0,0,0,0.15), 0 3px 10px rgba(0,0,0,0.4);
            white-space: nowrap; cursor: pointer; z-index: 2000;
            transform: translate(-50%, -100%) scale(var(--marker-scale, 1));
            transform-origin: center bottom;
        }

        /* 목록형 사이드바 (KPI 박스 클릭 시) */
        .list-header { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
        .list-subheader { font-size: 12px; color: var(--muted); }
        .list-subheader-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
        .list-sort-select {
            padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
            font-size: 11.5px; font-weight: 600; color: var(--ink); background: #fff; cursor: pointer;
        }
        .asset-list-item {
            padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px;
            margin-bottom: 12px; cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s;
            position: relative;
        }
        .asset-list-item:hover { background: #fafafa; border-color: #d4d4d4; box-shadow: var(--card-shadow); }
        .asset-list-item .row-name { font-weight: 700; font-size: 13.5px; color: var(--ink); margin-bottom: 5px; padding-right: 60px; }
        .asset-list-item .row-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
        .asset-list-item .row-schedule { font-weight: 700; color: #b5620a; }
        .row-compare-btn {
            position: absolute; top: 12px; right: 14px; z-index: 2;
            border: 1px solid var(--brand); background: #ffffff; color: var(--brand);
            border-radius: 999px; padding: 3px 10px; font-size: 10.5px; font-weight: 700; cursor: pointer;
        }
        .row-compare-btn.active { background: var(--brand); color: #fff; }
        .row-compare-btn:hover { background: var(--brand-tint); }
        .row-compare-btn.active:hover { background: var(--brand-dark); }

        .station-tooltip { background: var(--ink) !important; color: #fff !important; border: none !important; font-size: 10.5px !important; font-weight: 700 !important; padding: 3px 8px !important; border-radius: 6px !important; }

        /* ==========================================================================
           모바일 대응 (768px 이하) - PC 레이아웃은 위 규칙 그대로 유지
           ========================================================================== */
        @media (max-width: 768px) {
            #topbar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
            .brand-logo { height: 20px; }
            .brand-title { font-size: 14px; }
            .brand-subtitle { font-size: 10px; white-space: normal; }
            .topbar-center { order: 3; width: 100%; flex-direction: column; flex: none; margin-right: 0; }
            .topbar-search { width: 100%; }
            .topbar-actions { order: 2; margin-left: auto; }
            .stat-pill { padding: 6px 12px; }
            .stat-val { font-size: 13px; }
            .topbar-btn { padding: 7px 10px; font-size: 11px; }

            /* 지도(위) + 사이드바(아래) 세로 배치 */
            #body-row { flex-direction: column; }
            #map-container { flex: 1 1 auto; min-height: 38vh; }
            #sidebar {
                width: 100%; height: 40vh; flex: none;
                border-left: none; border-top: 1px solid var(--line);
            }
            .sidebar-content { padding: 18px 16px; }

            /* 자산 상세/목록 폰트 살짝 축소 */
            .asset-title { font-size: 17px; }
            .summary-val-blue, .summary-val-dark { font-size: 15px; }
            .detail-label { width: 100px; font-size: 12.5px; }
            .detail-val { font-size: 12.5px; }
        }
    </style>
</head>
<body>

    <div id="app-shell">
        <!-- 상단 고정 내비게이션 바 -->
        <header id="topbar">
            <div class="topbar-brand" onclick="location.reload()" title="홈으로 이동" role="button">

    <script>
        var currentDetailItem = null;
        var compareList = [];

        function isInCompare(code) { return compareList.indexOf(code) !== -1; }

        function toggleCompare(code) {
            var idx = compareList.indexOf(code);
            if (idx >= 0) {
                compareList.splice(idx, 1);
            } else {
                if (compareList.length >= 3) {
                    alert('비교함에는 최대 3건까지만 담을 수 있습니다. 기존 항목을 먼저 제거해 주세요.');
                    return;
                }
                compareList.push(code);
            }
            updateCompareBadge();
        }

        function updateCompareBadge() {
            var badge = document.getElementById('compare-float-btn');
            if (!badge) return;
            if (compareList.length > 0) {
                badge.style.display = 'flex';
                document.getElementById('compare-float-count').innerText = compareList.length;
            } else {
                badge.style.display = 'none';
            }
        }

        function renderCompareTable() {
            var items = compareList.map(function(code) {
                return currentDataset.assets.filter(function(a) { return a.code === code; })[0];
            }).filter(Boolean);

            if (items.length === 0) {
                document.getElementById('sidebar-target').innerHTML =
                    '<div class="empty-side"><div class="icon">⚖️</div>비교함에 담긴 자산이 없습니다.<br>목록 또는 상세정보에서 "비교함에 추가"를 눌러주세요.</div>';
                return;
            }

            var rows = [
                { label: '유형', get: function(a) { return a.type === 'LAND' ? '🌱 토지' : '🏢 건물'; } },
                { label: '소재지', get: function(a) { return a.address; } },
                { label: '면적', get: function(a) {
                    return a.type === 'LAND'
                        ? (formatNum(a.areaM2) + '㎡ (' + a.areaPy + '평)')
                        : (formatNum(a.gfaM2) + '㎡ (' + a.gfaPy + '평)');
                } },
                { label: '평당가', get: function(a) { return a.pricePy || '-'; } },
                { label: '총금액', get: function(a) { return a.totalPrice || '-'; } },
                { label: '일정/준공', get: function(a) { return a.type === 'LAND' ? (a.schedule || '-') : (a.completion || '-'); } },
                { label: '최근접역', get: function(a) {
                    var ns = findNearestStation(a.center);
                    return ns ? (ns.name + '역 · 도보 ' + ns.walkMin + '분') : '-';
                } },
                { label: '인근시세 대비', get: function(a) {
                    return '<span id="verdict-cell-' + a.code + '" style="font-size:11px; color:#a3a3a3;">⏳ 조회 중...</span>';
                } }
            ];

            var html = '<div class="list-header">⚖️ 자산 비교 (' + items.length + '건)</div>' +
                        '<div class="list-subheader">최대 3건까지 나란히 비교할 수 있습니다.</div>' +
                        '<div class="compare-table" style="grid-template-columns: 68px repeat(' + items.length + ', 1fr);">' +
                        '<div class="ct-cell ct-label"></div>';

            items.forEach(function(a) {
                html += '<div class="ct-cell ct-head">' +
                            '<button class="ct-remove" onclick="toggleCompare(\'' + a.code + '\'); renderCompareTable(); updateCompareBadge();">✕</button>' +
                            '<div class="ct-head-name">' + a.name + '</div>' +
                        '</div>';
            });

            rows.forEach(function(r) {
                html += '<div class="ct-cell ct-label">' + r.label + '</div>';
                items.forEach(function(a) { html += '<div class="ct-cell">' + r.get(a) + '</div>'; });
            });

            html += '</div>' +

        // 비교표의 "인근시세 대비" 셀 하나를 채우는 경량 조회 (표시용 요약치만 계산, 상세 목록/그래프는 만들지 않음)
        function fetchCompareVerdict(item) {
            var cell = document.getElementById('verdict-cell-' + item.code);
            if (!cell) return;

            var subjectWon = parsePricePyToWon(item.pricePy);
            if (!subjectWon) { cell.innerHTML = '<span style="color:#a3a3a3;">가격정보 없음</span>'; return; }

            if (!lawdCd) { cell.innerHTML = '<span style="color:#a3a3a3;">지역 인식 불가</span>'; return; }

            var type = item.type;
            var months = recentYearMonths(12);
            var dongName = extractDongName(item.address);

            Promise.all(months.map(function(ym) { return fetchOneMonth(type, lawdCd, ym).catch(function() { return []; }); }))
                .then(function(results) {
                    var all = [].concat.apply([], results);
                    if (all.length === 0) { cell.innerHTML = '<span style="color:#a3a3a3;">비교자료 없음</span>'; return; }

                    var narrowed = dongName ? all.filter(function(r) { return r.umdNm === dongName; }) : [];
                    var used = narrowed.length >= 3 ? narrowed : all;
                    var sixMonthsAgo = monthsAgoYYYYMM(6);
                    var recentUsed = used.filter(function(r) { return itemYYYYMM(r) >= sixMonthsAgo; });
                    if (recentUsed.length === 0) { recentUsed = used; }

                    var pricesPy = [];
                    recentUsed.forEach(function(r) {

                        var a2 = parseFloat(type === 'LAND' ? r.dealArea : r.buildingAr);
                        if (w > 0 && a2 > 0) pricesPy.push((w / a2) * 3.3058);
                    });

                    if (pricesPy.length === 0) { cell.innerHTML = '<span style="color:#a3a3a3;">비교자료 없음</span>'; return; }

                    var avg = pricesPy.reduce(function(s, v) { return s + v; }, 0) / pricesPy.length;
                    var diffPct = ((subjectWon - avg) / avg) * 100;
                    var cls, text;
                    if (diffPct > 15) { cls = 'verdict-high'; text = '고평가 (+' + diffPct.toFixed(1) + '%)'; }
                    else if (diffPct < -15) { cls = 'verdict-low'; text = '저평가 (' + diffPct.toFixed(1) + '%)'; }
                    else { cls = 'verdict-mid'; text = '적정 (' + (diffPct >= 0 ? '+' : '') + diffPct.toFixed(1) + '%)'; }

        }

        function guessLawdCode(address) {

        // 주소에서 법정동(동/읍/면) 이름 추출 (예: "삼평동 642" -> "삼평동")
        function extractDongName(address) {
            if (!address) return null;
            var m = address.match(/([가-힣0-9]+(동|읍|면))\s*[\d]/);
            return m ? m[1] : null;
        }

        // 최근 n개월의 계약년월(YYYYMM) 배열 생성
        function recentYearMonths(n) {
            var arr = [];
            var d = new Date();
            for (var i = 0; i < n; i++) {
                arr.push(d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0'));
                d.setMonth(d.getMonth() - 1);
            }
            return arr;
        }

        // 거래 항목의 계약년월을 정수(YYYYMM)로 변환 (최근 N개월 필터링용)
        function itemYYYYMM(r) { return parseInt(String(r.dealYear) + String(r.dealMonth).padStart(2, '0'), 10); }
        function monthsAgoYYYYMM(n) {
            var d = new Date(); d.setMonth(d.getMonth() - n);
            return d.getFullYear() * 100 + (d.getMonth() + 1);
        }

        // "4,800만 원/평" 등의 텍스트에서 평당가(원) 추출
        // "37.4093, 127.1001" 형식의 단일 필드를 [위도, 경도] 배열로 변환
        function parseLatLng(text) {
            if (!text) return [NaN, NaN];
            var parts = String(text).split(',').map(function(s) { return parseFloat(s.trim()); });
            return [parts[0], parts[1]];
        }

        function parsePricePyToWon(text) {
            if (!text) return null;
            var m = text.match(/([\d,]+(?:\.\d+)?)\s*(억|만)?\s*원/);
            if (!m) return null;
            var num = parseFloat(m[1].replace(/,/g, ''));
            if (isNaN(num)) return null;
            if (m[2] === '억') { num = num * 100000000; }
            else if (m[2] === '만') { num = num * 10000; }
            return num;
        }

        function xmlText(node, tag) {
            var el = node.getElementsByTagName(tag)[0];
            return el ? el.textContent.trim() : '';
        }

        // 국토부 API 1개월치 호출 (XML 파싱)
        function fetchOneMonth(type, lawdCd, ym) {

                '?serviceKey=' + MOLIT_SERVICE_KEY +
                '&LAWD_CD=' + lawdCd + '&DEAL_YMD=' + ym + '&numOfRows=200&pageNo=1';

            return fetch(url).then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            }).then(function(text) {
                var xml = new DOMParser().parseFromString(text, 'text/xml');
                var parseErr = xml.getElementsByTagName('parsererror');
                if (parseErr.length > 0) throw new Error('XML 파싱 실패');

                var resultCode = xmlText(xml, 'resultCode');
                if (resultCode && resultCode !== '000' && resultCode !== '00') {
                    throw new Error('API 오류코드 ' + resultCode + ' (' + xmlText(xml, 'resultMsg') + ')');
                }

                var items = xml.getElementsByTagName('item');
                var out = [];
                for (var i = 0; i < items.length; i++) {

                    if (type === 'LAND') {

                            landUse: xmlText(it, 'landUse'),

                        });

        function runMarketComparison() {

                    if (recentUsed.length === 0) { recentUsed = used; } // 최근 6개월 거래가 없으면 전체 기간으로 대체

                    // 월별 평당가 추이 (최근 12개월) - 상단 요약과 동일한 '월' 단위로 집계해 숫자 해석 일관성 유지

                        return { label: ym.slice(4, 6) + '월', avg: mAvg, count: mPrices.length };
                    }).reverse();

        function barRow(label, value, maxVal, color) {
            var pct = Math.max(2, Math.min(100, (value / maxVal) * 100));
            return '<div class="compare-chart-row">' +
                '<div class="compare-chart-label">' + label + '</div>' +
                '<div class="compare-chart-track"><div class="compare-chart-bar" style="width:' + pct + '%; background:' + color + ';"></div></div>' +
                '<div class="compare-chart-val">' + Math.round(value / 10000).toLocaleString() + '만원/평</div>' +
                '</div>';
        }

        // 최근 6개월 평당가 추이를 간단한 SVG 라인 차트로 렌더링
        function renderTrendChart(monthlyAvg) {
            var valid = monthlyAvg.filter(function(m) { return m.avg !== null; });
            if (valid.length < 2) {
                return '<div style="font-size:12px; color:#a3a3a3; margin-bottom:16px;">추이를 그리기엔 월별 거래 표본이 부족합니다.</div>';
            }

            var W = 460, H = 100, padL = 44, padR = 12, padT = 14, padB = 22;
            var vals = valid.map(function(m) { return m.avg; });
            var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
            if (minV === maxV) { minV -= 1; maxV += 1; }
            var n = monthlyAvg.length;
            var stepX = (W - padL - padR) / (n - 1);

            function xAt(i) { return padL + stepX * i; }
            function yAt(v) { return padT + (H - padT - padB) * (1 - (v - minV) / (maxV - minV)); }

            var pathD = '', points = '';
            var prevValid = false;
            monthlyAvg.forEach(function(m, i) {
                if (m.avg === null) { prevValid = false; return; }
                var x = xAt(i), y = yAt(m.avg);
                pathD += (prevValid ? ' L ' : ' M ') + x + ' ' + y;
                points += '<circle cx="' + x + '" cy="' + y + '" r="3.2" fill="#004986"></circle>' +
                          '<text x="' + x + '" y="' + (y - 8) + '" font-size="9.5" text-anchor="middle" fill="#222222" font-weight="700">' + Math.round(m.avg / 10000) + '</text>';
                prevValid = true;
            });

            var labels = monthlyAvg.map(function(m, i) {
                return '<text x="' + xAt(i) + '" y="' + (H - 4) + '" font-size="10" text-anchor="middle" fill="#717171">' + m.label + '</text>';
            }).join('');

            return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto; margin-bottom:18px;">' +
                '<path d="' + pathD + '" fill="none" stroke="#004986" stroke-width="2"></path>' +
                points + labels +
                '</svg>';
        }

        /* ==========================================================================
           1-1. 최근접 지하철역 도보거리 자동 계산 (Haversine 공식)
           ========================================================================== */
        function haversineKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function findNearestStation(center) {
            var best = null, bestDist = Infinity;
            transitNetwork.forEach(function(line) {
                line.stations.forEach(function(st) {
                    var d = haversineKm(center[0], center[1], st.p[0], st.p[1]);
                    if (d < bestDist) { bestDist = d; best = { name: st.n, line: line.name, distKm: d }; }
                });
            });
            if (!best) return null;
            best.walkMin = Math.max(1, Math.round(best.distKm / 4.8 * 60)); // 도보 약 4.8km/h 가정
            best.distM = Math.round(best.distKm * 1000);
            return best;
        }

        /* ==========================================================================
           2. 지도 초기화 (안정적인 OSM 타일 서버, 외부 fetch 없음)

        // 진단: Leaflet 라이브러리 자체가 로드되지 않았다면(=CDN 차단) 원인을 화면에 표시
        if (typeof L === 'undefined') {

                '<b>unpkg.com 등 외부 CDN 접속을 차단</b>하고 있기 때문입니다.<br><br>' +
                '① 이 HTML 파일을 <b>다운로드하여 저장한 뒤</b>, 사내망이 아닌 일반 인터넷(가정용 와이파이, 휴대폰 핫스팟 등)에 연결된 크롬/엣지 브라우저에서 직접 더블클릭해 열어보세요.<br>' +
                '② 그래도 안 뜨면 F12(개발자 도구) → Console 탭의 빨간 에러 메시지를 확인해 알려주세요.' +
                '</div>';
        }

        var HOME_LOCATION = { name: "펄어비스 홈 원", center: [37.4064817, 126.9833096] };

        var map = L.map('map').setView(HOME_LOCATION.center, 14);

        // 줌 레벨에 따라 마커 크기를 함께 축소/확대 (축소 시 마커 중첩 완화)
        function updateMarkerScale() {
            var z = map.getZoom();
            var scale = Math.max(0.5, Math.min(1.1, (z - 8) / 7));
            document.documentElement.style.setProperty('--marker-scale', scale);
        }
        map.on('zoomend', updateMarkerScale);

        var tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {

        // 진단: 타일 이미지 자체가 차단(방화벽)되는 경우를 감지
        var tileErrorCount = 0;
        tileLayer.on('tileerror', function() {

                document.getElementById('map-container').appendChild(warn);

        });

        var landLayer = L.layerGroup().addTo(map);
        var bldgLayer = L.layerGroup().addTo(map);
        var transitLayer = L.layerGroup().addTo(map);

        // 회사 위치 마커 (토지/건물과 완전히 구분되는 전용 마커, 필터의 영향을 받지 않음)
        var homeIcon = L.divIcon({
            className: '',
            html: '<div class="pin-home">🏠 ' + HOME_LOCATION.name + '</div>'
        });
        L.marker(HOME_LOCATION.center, { icon: homeIcon, zIndexOffset: 2000 }).addTo(map)
            .bindTooltip(HOME_LOCATION.name, { direction: 'top', className: 'station-tooltip' });

        // 철도망 렌더링
        transitNetwork.forEach(function(route) {
            var coords = route.stations.map(function(s) { return s.p; });
            L.polyline(coords, {
                color: route.color, weight: 3.5, opacity: 0.85, dashArray: route.dash || null
            }).addTo(transitLayer);

            route.stations.forEach(function(st) {

                }).bindTooltip('<strong>' + route.name + '</strong>: ' + st.n + '역', { direction: 'top', className: 'station-tooltip' }).addTo(transitLayer);
            });
        });

        /* ==========================================================================
           3. 상세 사이드바 렌더러 (참고 이미지와 동일 양식)

        function renderSidebarDetail(item) {

                        '<div class="detail-item"><div class="detail-label">건축면적</div><div class="detail-val">' + formatNum(item.bareaM2) + ' ㎡ (' + (item.bareaPy || '-') + '평)</div></div>' +
                        '<div class="detail-item"><div class="detail-label">대지면적</div><div class="detail-val">' + formatNum(item.lareaM2) + ' ㎡ (' + (item.lareaPy || '-') + '평)</div></div>' +
                        '<div class="detail-item"><div class="detail-label">건물 규모/층수</div><div class="detail-val">' + (item.floors || '-') + '</div></div>' +

                        '<div class="detail-item"><div class="detail-label">최근접 지하철역</div><div class="detail-val">' + nsText + '</div></div>' +
                        '<div class="detail-item"><div class="detail-label">네이버 로드뷰</div><div class="detail-val">' + (item.roadview ? '<a href="' + item.roadview + '" target="_blank" rel="noopener" style="color:#004986; text-decoration:underline;">로드뷰 열기 ↗</a>' : '-') + '</div></div>' +
                    '</div>' +

            html += '<button class="compare-btn" id="compare-toggle-analysis-btn" onclick="toggleMarketComparison()">📊 인근 실거래가 비교 분석 <span id="compare-analysis-chevron">▾</span></button>' +
                    '<div id="compare-result" style="display:none;"></div>';

        // 상단 배지 옆에 붙는 작은 "비교함" 토글 버튼
        function compareBtnHtml(item) {
            var inCompare = isInCompare(item.code);
            return '<button class="compare-add-small' + (inCompare ? ' active' : '') + '" onclick="toggleCompare(\'' + item.code + '\'); renderSidebarDetail(currentDetailItem);">' +
                    (inCompare ? '✓ 비교함' : '비교함+') +

        /* ==========================================================================
           4. 자산 마커 렌더링 및 KPI 계산
           ========================================================================== */
        /* ==========================================================================
           4-0. 상세 필터 (부동산 유형 / 면적 / 평당가 / 거래가능상태)
           ========================================================================== */
        var advFilter = { type: 'ALL', areaMin: 0, areaMax: 999999999, priceMin: 0, priceMax: 999999999 };

        function getAssetArea(a) { return a.type === 'LAND' ? (a.areaM2 || 0) : (a.gfaM2 || 0); }
        function getAssetAreaPy(a) { return getAssetArea(a) / 3.3058; }
        function getAssetPricePyManwon(a) { var w = parsePricePyToWon(a.pricePy); return w ? Math.round(w / 10000) : null; }
        function passesAdvancedFilter(item) {
            if (advFilter.type !== 'ALL' && item.type !== advFilter.type) return false;
            var area = getAssetAreaPy(item);
            if (area > 0 && (area < advFilter.areaMin || area > advFilter.areaMax)) return false;
            var price = getAssetPricePyManwon(item);
            if (price !== null && (price < advFilter.priceMin || price > advFilter.priceMax)) return false;
            return true;
        }

        function computeFilterBounds() {
            var areas = currentDataset.assets.map(getAssetAreaPy).filter(function(v) { return v > 0; });
            var prices = currentDataset.assets.map(getAssetPricePyManwon).filter(function(v) { return v !== null; });
            return {
                areaMin: areas.length ? Math.floor(Math.min.apply(null, areas)) : 0,
                areaMax: areas.length ? Math.ceil(Math.max.apply(null, areas)) : 10000,
                priceMin: prices.length ? Math.floor(Math.min.apply(null, prices)) : 0,
                priceMax: prices.length ? Math.ceil(Math.max.apply(null, prices)) : 10000
            };
        }

        function updateRangeUI(prefix, unit) {
            var minEl = document.getElementById(prefix + '-min'), maxEl = document.getElementById(prefix + '-max');
            var fillEl = document.getElementById(prefix + '-fill');
            var lo = parseFloat(minEl.min), hi = parseFloat(minEl.max);
            var minVal = parseFloat(minEl.value), maxVal = parseFloat(maxEl.value);
            var range = hi - lo;
            var leftPct = range > 0 ? ((minVal - lo) / range) * 100 : 0;
            var rightPct = range > 0 ? ((maxVal - lo) / range) * 100 : 100;
            fillEl.style.left = leftPct + '%';
            fillEl.style.width = Math.max(0, rightPct - leftPct) + '%';
            document.getElementById(prefix + '-min-label').innerText = Math.round(minVal).toLocaleString() + unit;
            document.getElementById(prefix + '-max-label').innerText = Math.round(maxVal).toLocaleString() + unit;

            if (prefix === 'area') { advFilter.areaMin = minVal; advFilter.areaMax = maxVal; }
            else { advFilter.priceMin = minVal; advFilter.priceMax = maxVal; }
        }

        function bindRangePair(prefix, unit) {
            var minEl = document.getElementById(prefix + '-min'), maxEl = document.getElementById(prefix + '-max');
            minEl.addEventListener('input', function() {
                if (parseFloat(minEl.value) > parseFloat(maxEl.value)) { minEl.value = maxEl.value; }
                updateRangeUI(prefix, unit); renderAssets(currentDataset);
            });
            maxEl.addEventListener('input', function() {
                if (parseFloat(maxEl.value) < parseFloat(minEl.value)) { maxEl.value = minEl.value; }
                updateRangeUI(prefix, unit); renderAssets(currentDataset);
            });
        }

        function initAdvancedFilterUI() {
            var b = computeFilterBounds();
            var areaMinEl = document.getElementById('area-min'), areaMaxEl = document.getElementById('area-max');
            var priceMinEl = document.getElementById('price-min'), priceMaxEl = document.getElementById('price-max');

            areaMinEl.min = areaMaxEl.min = b.areaMin;
            areaMinEl.max = areaMaxEl.max = b.areaMax;
            areaMinEl.value = b.areaMin; areaMaxEl.value = b.areaMax;

            priceMinEl.min = priceMaxEl.min = b.priceMin;
            priceMinEl.max = priceMaxEl.max = b.priceMax;
            priceMinEl.value = b.priceMin; priceMaxEl.value = b.priceMax;

            document.getElementById('flt-type').value = 'ALL';
            advFilter.type = 'ALL';

            updateRangeUI('area', '평');
            updateRangeUI('price', '만원');
        }

        function resetAdvancedFilters() {
            initAdvancedFilterUI();
            renderAssets(currentDataset);
        }

        document.getElementById('flt-type').addEventListener('change', function(e) { advFilter.type = e.target.value; renderAssets(currentDataset); });
        bindRangePair('area', '평');
        bindRangePair('price', '만원');

        function renderAssets(dataset) {
            landLayer.clearLayers();
            bldgLayer.clearLayers();

            dataset.assets.forEach(function(item) {
                if (!passesAdvancedFilter(item)) { return; }

                var isLand = item.type === "LAND";
                var pinClass, icon;

                if (isLand) {
                    icon = "🌱";
                    pinClass = "pin-land";
                } else {
                    icon = "🏢";
                    pinClass = "pin-bldg";
                }

                var marker = L.marker(item.center, {
                    icon: L.divIcon({
                        className: '',
                        html: '<div class="pin ' + pinClass + '"><span class="pin-label">' + icon + ' ' + item.name + '</span></div>'
                    })
                });

                marker.bindTooltip(item.name, { direction: 'top', offset: [0, -8], className: 'station-tooltip' });

                marker.on('click', function() {
                    map.flyTo(item.center, 14, { animate: true, duration: 0.7 });
                    renderSidebarDetail(item);
                });

                marker.addTo(isLand ? landLayer : bldgLayer);
            });

            // 상단 KPI는 필터와 무관하게 "전체 관리 데이터" 개수를 항상 표시
            var landAllTotal = dataset.assets.filter(function(a) { return a.type === 'LAND'; }).length;
            var bldgAllTotal = dataset.assets.filter(function(a) { return a.type === 'BUILDING'; }).length;
            document.getElementById('kpi-land-status').innerText = landAllTotal;
            document.getElementById('kpi-bldg-status').innerText = bldgAllTotal;
            document.getElementById('header-report-date').innerText = dataset.reportDate;
        }

        /* ==========================================================================
           4-1. KPI 박스 클릭 시 자산 목록 표출 (정렬 기준 선택 가능)
           ========================================================================== */
        // "2025년 05월", "2025-05", "2025.05", "2025/05", "202505" 등 다양한 표기를 폭넓게 인식
        function parseYmFlexible(val) {
            if (val === null || val === undefined || val === '') return null;
            var s = String(val).trim();
            var m = s.match(/(\d{4})\s*[-.\/년]?\s*(\d{1,2})/);
            if (m) { return parseInt(m[1], 10) * 100 + parseInt(m[2], 10); }
            return null;
        }

        function parseScheduleSortKey(schedule) {
            var ym = parseYmFlexible(schedule);
            return ym !== null ? ym : Infinity;
        }

        var listSortState = { type: null, sort: null };

        // 정렬 기준별 비교값 추출 (숫자는 오름/내림차순 뺄셈, 문자열은 localeCompare로 처리)
        function getSortValue(item, key) {
            if (key === 'schedule') {
                // 엑셀의 '공급연월(정렬용)' 값이 있으면 그걸 우선 사용, 없으면 자유 텍스트에서 최대한 추출
                return (item.scheduleYm !== null && item.scheduleYm !== undefined) ? item.scheduleYm : parseScheduleSortKey(item.schedule);
            }
            if (key === 'completion') return parseScheduleSortKey(item.completion);
            if (key === 'price') { var p = getAssetPricePyManwon(item); return p === null ? Infinity : p; }
            if (key === 'area') { var a = getAssetAreaPy(item); return a > 0 ? a : Infinity; }
            if (key === 'code') return item.code || '';
            return 0;
        }

        function applyListSort(list, sortVal) {
            var parts = sortVal.split('_');
            var key = parts[0], dir = parts[1];
            list.sort(function(a, b) {
                var va = getSortValue(a, key), vb = getSortValue(b, key);
                if (typeof va === 'string') {
                    return dir === 'asc' ? va.localeCompare(vb, undefined, { numeric: true }) : vb.localeCompare(va, undefined, { numeric: true });
                }
                return dir === 'asc' ? (va - vb) : (vb - va);
            });
        }

        function onListSortChange(val, type) {
            listSortState.sort = val;
            renderAssetList(type);
        }

        function renderAssetList(type) {
            var isLand = type === "LAND";
            var list = currentDataset.assets.filter(function(a) { return a.type === type; });

            // 토지: 공급일정/평당가/면적 기준 정렬 제공 · 건물: 평당가/면적/준공년월/일련번호 기준 정렬 제공
            var sortOptions = isLand ? [
                { v: 'schedule_asc', l: '공급일정 빠른 순' },
                { v: 'schedule_desc', l: '공급일정 늦은 순' },
                { v: 'price_asc', l: '평당가 낮은 순' },
                { v: 'price_desc', l: '평당가 높은 순' },
                { v: 'area_asc', l: '면적 작은 순' },
                { v: 'area_desc', l: '면적 큰 순' }
            ] : [
                { v: 'price_asc', l: '평당가 낮은 순' },
                { v: 'price_desc', l: '평당가 높은 순' },
                { v: 'area_asc', l: '연면적 작은 순' },
                { v: 'area_desc', l: '연면적 큰 순' },
                { v: 'completion_asc', l: '준공 오래된 순' },
                { v: 'completion_desc', l: '준공 최신 순' },
                { v: 'code_asc', l: '일련번호 순' }
            ];

            if (listSortState.type !== type) {
                listSortState.type = type;
                listSortState.sort = isLand ? 'schedule_asc' : 'code_asc';
            }

            applyListSort(list, listSortState.sort);

            var optionsHtml = sortOptions.map(function(o) {
                return '<option value="' + o.v + '"' + (o.v === listSortState.sort ? ' selected' : '') + '>' + o.l + '</option>';
            }).join('');

            var html = '<div class="list-header">' + (isLand ? '🌱 토지' : '🏢 건물') + ' 목록</div>' +
                        '<div class="list-subheader-row">' +
                            '<div class="list-subheader">' + list.length + '건</div>' +
                            '<select class="list-sort-select" onchange="onListSortChange(this.value, \'' + type + '\')">' + optionsHtml + '</select>' +
                        '</div>';

            if (list.length === 0) {
                html += '<div class="empty-side" style="margin-top:60px;"><div class="icon">📭</div>데이터가 없습니다.</div>';
            } else {
                list.forEach(function(item) {
                    var cmp = isInCompare(item.code);
                    html += '<div class="asset-list-item" data-code="' + item.code + '">' +
                        '<button class="row-compare-btn' + (cmp ? ' active' : '') + '" onclick="event.stopPropagation(); toggleCompare(\'' + item.code + '\'); updateCompareBadge(); renderAssetList(\'' + type + '\');">' + (cmp ? '✓ 비교' : '+ 비교') + '</button>' +
                        '<div class="row-name">' + item.name + '</div>' +
                        '<div class="row-meta">' +
                        (isLand
                            ? '일련번호 ' + item.code + ' · <span class="row-schedule">' + (item.schedule || '-') + '</span>'
                            : '일련번호 ' + item.code) +
                        '<br>' + item.address +
                        '</div></div>';
                });
            }

            document.getElementById('sidebar-target').innerHTML = html;

            var rows = document.querySelectorAll('.asset-list-item');
            rows.forEach(function(row, i) {
                row.addEventListener('click', function() {
                    var item = list[i];
                    map.flyTo(item.center, 14, { animate: true, duration: 0.7 });
                    renderSidebarDetail(item);
                });
            });
        }

        document.getElementById('kpi-box-land').addEventListener('click', function() { renderAssetList('LAND'); });
        document.getElementById('kpi-box-bldg').addEventListener('click', function() { renderAssetList('BUILDING'); });

        /* ==========================================================================
           4-2. 검색 기능 (지역명 / 자산명 키워드)
           ========================================================================== */
        /* ==========================================================================
           4-3. 상단 필터 드롭다운 토글
           ========================================================================== */
        function toggleFilterPanel() {
            document.getElementById('filter-panel').classList.toggle('open');
        }
        document.addEventListener('click', function(e) {
            var panel = document.getElementById('filter-panel');
            var dropdown = document.querySelector('.map-filter-dropdown');
            if (panel.classList.contains('open') && !dropdown.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        function runSearch() {
            var q = document.getElementById('search-input').value.trim();
            if (!q) return;

            var list = currentDataset.assets.filter(function(a) {
                return (a.name && a.name.indexOf(q) !== -1) || (a.address && a.address.indexOf(q) !== -1);
            });

            var html = '<div class="list-header">🔎 "' + q + '" 검색 결과</div>' +
                        '<div class="list-subheader">' + list.length + '건</div>';

            if (list.length === 0) {
                html += '<div class="empty-side" style="margin-top:60px;"><div class="icon">🔍</div>검색 결과가 없습니다.<br>지역명 또는 자산명으로 다시 검색해 보세요.</div>';
            } else {
                list.forEach(function(item) {
                    var isLand = item.type === "LAND";
                    var cmp = isInCompare(item.code);
                    html += '<div class="asset-list-item">' +
                        '<button class="row-compare-btn' + (cmp ? ' active' : '') + '" onclick="event.stopPropagation(); toggleCompare(\'' + item.code + '\'); updateCompareBadge(); runSearch();">' + (cmp ? '✓ 비교' : '+ 비교') + '</button>' +
                        '<div class="row-name">' + (isLand ? '🌱' : '🏢') + ' ' + item.name + '</div>' +
                        '<div class="row-meta">일련번호 ' + item.code + '<br>' + item.address + '</div></div>';
                });
            }

            document.getElementById('sidebar-target').innerHTML = html;
            var rows = document.querySelectorAll('.asset-list-item');
            rows.forEach(function(row, i) {
                row.addEventListener('click', function() {
                    var item = list[i];
                    map.flyTo(item.center, 14, { animate: true, duration: 0.7 });
                    renderSidebarDetail(item);
                });
            });
        }

        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { runSearch(); }
        });

        // 필터 체크박스 연동 (자산 구분 / 지도 레이어 각각 독립 동작)
        document.getElementById('chk-transit').onchange = function(e) { e.target.checked ? map.addLayer(transitLayer) : map.removeLayer(transitLayer); };

        /* ==========================================================================
           5. 엑셀 업로드 / 다운로드 / HTML 저장
           ========================================================================== */
        document.getElementById('excel-file').addEventListener('change', function(e) {
            if (typeof XLSX === 'undefined') {
                alert('엑셀 처리 라이브러리(XLSX)를 불러오지 못했습니다.\n네트워크(사내망 방화벽 등)에서 unpkg.com 접속이 차단되어 있을 수 있습니다.\n일반 인터넷 환경에서 다시 시도해 주세요.');
                return;
            }
            if (!e.target.files || !e.target.files[0]) { return; }
            var reader = new FileReader();
            reader.onerror = function() {
                alert('파일을 읽는 중 오류가 발생했습니다.');
            };
            reader.onload = function(evt) {
              try {
                var workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                var rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (!rows.length) {
                    alert('엑셀 시트에서 데이터를 찾지 못했습니다. 첫 번째 시트에 데이터가 있는지 확인해 주세요.');
                    return;
                }

                currentDataset.assets = rows.map(function(r) {
                    var isL = r['구분'] === '토지';
                    if (isL) {
                        var areaM2 = parseFloat(r['대지면적_㎡'] || 0);
                        return {
                            type: 'LAND',
                            code: r['일련번호'] || '-',
                            name: r['자산명'] || '미명명 토지',
                            address: r['소재지'] || '-',
                            schedule: r['공급예정일정'] || '-',
                            scheduleYm: parseYmFlexible(r['공급연월(정렬용)']),
                            areaM2: areaM2,
                            areaPy: (areaM2 / 3.3058).toFixed(1),
                            zoning: r['용도지역_지목'] || '-',
                            bcrFar: r['건폐율_용적률_층수'] || '-',
                            pricePy: r['평당가'] || '-',
                            totalPrice: r['총금액'] || '-',
                            center: parseLatLng(r['위도,경도']),
                            opinion: r['검토의견'] || '-',
                            roadview: r['네이버로드뷰'] || ''
                        };
                    } else {
                        var gfaM2 = parseFloat(r['연면적_㎡'] || 0);
                        var bareaM2 = parseFloat(r['건축면적_㎡'] || 0);
                        var lareaM2 = parseFloat(r['대지면적_㎡'] || 0);
                        return {
                            type: 'BUILDING',
                            code: r['일련번호'] || '-',
                            name: r['자산명'] || '미명명 건물',
                            address: r['소재지'] || '-',
                            dealType: r['거래_검토유형'] || '-',
                            gfaM2: gfaM2,
                            gfaPy: (gfaM2 / 3.3058).toFixed(1),
                            bareaM2: bareaM2,
                            bareaPy: (bareaM2 / 3.3058).toFixed(1),
                            lareaM2: lareaM2,
                            lareaPy: (lareaM2 / 3.3058).toFixed(1),
                            floors: r['규모_층수'] || '-',
                            completion: r['준공년월'] || '-',
                            pricePy: r['평당가'] || '-',
                            totalPrice: r['총금액'] || '-',
                            center: parseLatLng(r['위도,경도']),
                            opinion: r['검토의견'] || '-',
                            roadview: r['네이버로드뷰'] || ''
                        };
                    }
                });
                // 기준일: 엑셀 최상단(첫 번째) 행의 '기준일' 값만 확인, 없으면 오늘 날짜를 기본값으로 사용
                var topRowRefDate = rows[0] ? rows[0]['기준일'] : null;
                var uploadedRefDate = topRowRefDate ? ((topRowRefDate instanceof Date) ? topRowRefDate.toISOString().slice(0, 10) : String(topRowRefDate)) : null;
                currentDataset.reportDate = uploadedRefDate ? (uploadedRefDate + " 기준") : todayReportDate();

                // 위도,경도는 엑셀에 입력된 값을 그대로 사용합니다 (자동 좌표 변환 없음)
                var invalidRows = currentDataset.assets.filter(function(a) {
                    return !(isFinite(a.center[0]) && isFinite(a.center[1]));
                }).map(function(a) { return a.name + ' (' + a.address + ')'; });

                renderAssets(currentDataset);
                initAdvancedFilterUI(); // 새 데이터 기준으로 필터 슬라이더 범위 재설정
                renderAssets(currentDataset);
                if (currentDataset.assets.length > 0) { renderSidebarDetail(currentDataset.assets[0]); }

                var msg = '엑셀 데이터 ' + rows.length + '건을 지도에 반영했습니다.';
                if (invalidRows.length > 0) {
                    msg += '\n\n다음 ' + invalidRows.length + '건은 "위도,경도" 값이 비어있거나 형식이 올바르지 않아 지도에 표시되지 않습니다:\n- ' + invalidRows.join('\n- ') + '\n\n카카오맵/구글맵에서 해당 위치를 우클릭해 나온 좌표를 "위도, 경도" 형식으로 한 칸에 입력해 주세요.';
                }
                alert(msg);
              } catch (err) {
                var hint = '엑셀 양식(컬럼명)이 다운로드 받은 템플릿과 일치하는지 확인해 주세요.';
                if (/encrypt/i.test(err.message) || /EncryptionInfo/i.test(err.message)) {
                    hint = '이 파일이 암호로 보호되어 있거나("파일 > 정보 > 통합 문서 보호"에서 암호 해제 필요), ' +
                           'Excel이 아닌 다른 프로그램(WPS/한컴/Numbers 등)에서 저장되어 구조가 달라졌을 수 있습니다.\n' +
                           '가능하면 정품 Excel 또는 Google 스프레드시트에서 열어 "Excel 통합 문서(.xlsx)"로 다시 저장한 뒤 업로드해 주세요.';
                }
                alert('엑셀 처리 중 오류가 발생했습니다: ' + err.message + '\n\n' + hint);
                console.error(err);
              }
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        function downloadSampleExcel() {
            var sample = [
                { "구분": "토지", "일련번호": "LND-2025-01", "자산명": "판교 제2테크노밸리 상업·업무 A1", "소재지": "경기도 성남시 분당구 삼평동 642", "공급예정일정": "2025년 05월 공급공고 (D-40)", "공급연월(정렬용)": "2025-05", "대지면적_㎡": 3850, "용도지역_지목": "일반상업지역 / 업무시설용지", "건폐율_용적률_층수": "건폐율 60% / 용적률 400%", "평당가": "4,800만 원/평", "총금액": "약 559억 원", "위도,경도": "37.4093, 127.1001", "검토의견": "신분당선 판교역 인근 및 월곶판교선 수혜.", "네이버로드뷰": "https://map.naver.com/p/...", "기준일": "2025-05-01" },
                { "구분": "건물", "일련번호": "BLD-2025-03", "자산명": "인덕원 스테이션 타워", "소재지": "경기도 안양시 동안구 관양동 1488", "거래_검토유형": "통매각 / 밸류애드 검토", "연면적_㎡": 9800, "건축면적_㎡": 680, "대지면적_㎡": 950, "규모_층수": "지하 2층 / 지상 8층", "준공년월": "2014년 11월", "평당가": "1,950만 원/평 (연면적 기준)", "총금액": "578억 원", "위도,경도": "37.4014, 126.9768", "검토의견": "4호선 및 월곶판교선 환승 예정 인덕원역 초인접.", "네이버로드뷰": "https://map.naver.com/p/..." }
            ];
            var ws = XLSX.utils.json_to_sheet(sample);
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "자산데이터");
            XLSX.writeFile(wb, "부동산_자산관리_양식.xlsx");
        }

        function saveStandaloneHTML() {
            var fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            var updated = '<script id="dataset-script">\n        var currentDataset = ' + JSON.stringify(currentDataset, null, 4) + ';\n    <\/script>';
            fullHtml = fullHtml.replace(/<script id="dataset-script">[\s\S]*?<\/script>/, updated);

            var blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8;' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '부동산_자산관리_대시보드_' + new Date().toISOString().slice(0,10) + '.html';
            a.click();
        }

        // 초기 실행 (기준일이 지정되지 않았다면 오늘 날짜를 기본값으로 사용)
        if (!currentDataset.reportDate) { currentDataset.reportDate = todayReportDate(); }
        initAdvancedFilterUI();
        renderAssets(currentDataset);
        // 최초 접속 시에는 특정 자산이 아니라 안내 메시지를 표시
        document.getElementById('sidebar-target').innerHTML =
            '<div class="sidebar-welcome"><div class="icon">📌</div>지도 위의 마커를 클릭하시거나 검색을 통해<br>부동산 상세 정보를 확인할 수 있습니다.</div>';

        setTimeout(function() { map.invalidateSize(); }, 150);
        window.addEventListener('resize', function() { map.invalidateSize(); });
    </script>
